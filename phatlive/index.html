<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#CC0000">
    <title>VUA GA MANG - Xem Da Ga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
</head>
<body>
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <div class="start-icon">🐔</div>
            <h1>VUA GA MANG</h1>
            <p>Xem Da Ga Truc Tuyen</p>
            <button class="start-btn" id="startBtn">BAT DAU XEM</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🐔</span>
                <span class="logo-text">VUA GA MANG</span>
            </div>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span class="live-text">LIVE</span>
            </div>
        </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="blink-text">⚠️ ĐANG XANH SỮA BỚT LÀM PHIỀN</span>
    </div>

    <!-- Arena Tabs -->
    <nav class="arena-nav" id="arenaNav"></nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Video Section -->
        <section class="video-section">
            <div class="video-container" id="videoWrap">
                <video id="videoPlayer" playsinline></video>
                <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
                <div class="video-overlay" id="videoOverlay">
                    <div class="overlay-icon">🐔</div>
                    <p class="overlay-text" id="overlayText">Dang ket noi...</p>
                </div>
            </div>
        </section>

        <!-- Info Section -->
        <section class="info-section">
            <div class="info-card">
                <h3 class="info-title">📺 Thong Tin</h3>
                <div class="info-content">
                    <p>🐔 <strong>Vua Ga Mang</strong> - Xem Da Ga Truc Tuyen</p>
                    <p>📞 <strong>Hotline:</strong> 0704597148</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-brand">🐔 VUA GA MANG</p>
            <p class="footer-contact">📞 Hotline: 0704597148</p>
            <p class="footer-copyright">© 2026 Vua Ga Mang. All Rights Reserved.</p>
        </div>
    </footer>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --primary:#e60000;
    --primary-dark:#b30000;
    --primary-light:#ff3333;
    --gold:#ffc107;
    --bg:#f5f5f5;
    --card:#ffffff;
    --surface:#ffffff;
    --surface-alt:#f0f0f0;
    --text:#1a1a1a;
    --text-secondary:#666666;
    --dim:#999999;
    --border:#e0e0e0;
    --shadow:0 2px 8px rgba(0,0,0,.1);
    --shadow-lg:0 4px 20px rgba(0,0,0,.15);
    --r:12px;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
    font-family:'Be Vietnam Pro',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none
}

/* Start Screen */
.start-screen{
    position:fixed;inset:0;
    background:linear-gradient(135deg,#1a0000,var(--primary-dark),#1a0000);
    display:flex;align-items:center;justify-content:center;
    z-index:9999
}
.start-screen.hide{display:none}
.start-content{text-align:center;padding:24px}
.start-icon{
    font-size:clamp(80px,20vw,120px);
    margin-bottom:20px;
    animation:bounce 2s ease-in-out infinite
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.start-content h1{
    font-size:clamp(28px,7vw,42px);
    font-weight:800;
    color:#fff;
    text-shadow:0 0 30px rgba(230,0,0,.6);
    margin-bottom:8px;
    letter-spacing:3px
}
.start-content p{
    color:rgba(255,255,255,.8);
    font-size:clamp(14px,3.5vw,18px);
    margin-bottom:32px;
    font-weight:500
}
.start-btn{
    display:inline-block;
    padding:16px 48px;
    font-size:clamp(15px,4vw,18px);
    font-weight:700;
    background:linear-gradient(145deg,#fff,#f0f0f0);
    color:var(--primary);
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,.3);
    font-family:inherit;
    letter-spacing:1px;
    transition:all .2s
}
.start-btn:active{transform:scale(.96);box-shadow:0 2px 10px rgba(0,0,0,.2)}

/* Header */
.header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    padding:0;
    position:sticky;top:0;z-index:100;
    box-shadow:var(--shadow-lg)
}
.header-content{
    max-width:1200px;
    margin:0 auto;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between
}
.logo{
    display:flex;
    align-items:center;
    gap:10px
}
.logo-icon{
    font-size:clamp(24px,5vw,32px)
}
.logo-text{
    font-size:clamp(16px,4vw,22px);
    font-weight:800;
    color:#fff;
    letter-spacing:1px;
    text-shadow:0 2px 4px rgba(0,0,0,.2)
}
.live-indicator{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(0,0,0,.2);
    padding:6px 12px;
    border-radius:20px
}
.live-dot{
    width:10px;
    height:10px;
    background:#00ff00;
    border-radius:50%;
    animation:pulse-live 1s ease-in-out infinite
}
@keyframes pulse-live{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.8)}
}
.live-text{
    font-size:12px;
    font-weight:700;
    color:#fff;
    letter-spacing:1px
}

/* Status Bar */
.status-bar{
    background:#fff3cd;
    padding:12px 16px;
    text-align:center;
    border-bottom:1px solid var(--border)
}
.blink-text{
    font-size:clamp(13px,3.2vw,15px);
    font-weight:700;
    color:#856404;
    animation:blink .8s ease-in-out infinite
}
@keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:0}
}

/* Arena Nav */
.arena-nav{
    display:flex;
    background:var(--card);
    padding:12px;
    gap:10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    border-bottom:1px solid var(--border)
}
.arena-nav::-webkit-scrollbar{display:none}
.arena-btn{
    flex-shrink:0;
    min-width:70px;
    height:60px;
    border-radius:var(--r);
    border:2px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    transition:all .2s;
    -webkit-tap-highlight-color:transparent
}
.arena-btn .ico{font-size:22px}
.arena-btn.active{
    border-color:var(--primary);
    background:linear-gradient(145deg,var(--primary),var(--primary-dark));
    color:#fff;
    box-shadow:0 4px 12px rgba(230,0,0,.3)
}
.arena-btn:active:not(.active){transform:scale(.95)}

/* Main Content */
.main-content{
    max-width:1200px;
    margin:0 auto;
    padding:16px
}

/* Video Section */
.video-section{
    margin-bottom:20px
}
.video-container{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:var(--r);
    overflow:hidden;
    box-shadow:var(--shadow-lg)
}
.video-container video{
    width:100%;
    height:100%;
    display:block;
    background:#000
}
.video-overlay{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.9))
}
.overlay-icon{
    font-size:clamp(60px,15vw,100px);
    margin-bottom:16px;
    animation:bounce 2s ease-in-out infinite
}
.overlay-text{
    color:#fff;
    font-size:clamp(14px,3.5vw,16px);
    font-weight:500
}
.video-container:not(.has-video) .video-overlay{display:flex}
.video-container.has-video .video-overlay{display:none}

/* Fullscreen Button */
.fullscreen-btn{
    position:absolute;
    bottom:12px;
    right:12px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    border:2px solid var(--gold);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
    opacity:0;
    transition:opacity .3s;
    -webkit-tap-highlight-color:transparent
}
.video-container.show-controls .fullscreen-btn{
    display:flex;
    opacity:1
}
.fullscreen-btn:active{transform:scale(.95)}

/* Quick Links */
.quick-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px
}
.quick-link{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px 8px;
    background:var(--card);
    border-radius:var(--r);
    box-shadow:var(--shadow);
    text-decoration:none;
    color:var(--text);
    transition:all .2s
}
.quick-link:active{
    transform:scale(.95);
    box-shadow:0 1px 4px rgba(0,0,0,.1)
}
.quick-link .link-icon{
    font-size:28px;
    margin-bottom:6px
}
.quick-link .link-text{
    font-size:12px;
    font-weight:600
}

/* Info Section */
.info-section{
    margin-bottom:20px
}
.info-card{
    background:var(--card);
    border-radius:var(--r);
    box-shadow:var(--shadow);
    overflow:hidden
}
.info-title{
    padding:14px 16px;
    font-size:14px;
    font-weight:700;
    color:var(--text);
    background:var(--surface-alt);
    border-bottom:1px solid var(--border)
}
.info-content{
    padding:16px;
    font-size:14px;
    line-height:1.8;
    color:var(--text-secondary)
}
.info-content strong{
    color:var(--text)
}

/* Footer */
.footer{
    background:linear-gradient(135deg,var(--text),#333);
    padding:24px 16px;
    margin-top:auto
}
.footer-content{
    max-width:1200px;
    margin:0 auto;
    text-align:center
}
.footer-brand{
    font-size:18px;
    font-weight:700;
    color:#fff;
    margin-bottom:8px
}
.footer-contact{
    font-size:14px;
    color:rgba(255,255,255,.8);
    margin-bottom:8px
}
.footer-copyright{
    font-size:12px;
    color:rgba(255,255,255,.5)
}

/* Desktop */
@media(min-width:768px){
    .header-content{padding:14px 24px}
    .arena-nav{padding:14px;gap:12px}
    .arena-btn{min-width:80px;height:65px;font-size:12px}
    .arena-btn .ico{font-size:24px}
    .main-content{padding:24px}
    .quick-links{gap:16px}
    .quick-link{padding:20px 12px}
    .quick-link .link-icon{font-size:32px}
    .quick-link .link-text{font-size:13px}
}
</style>

<script>
(function(){
    var ARENAS={
        cpc2:{n:'CPC2',i:'🎯',o:true},
        cpc3:{n:'CPC3',i:'🎯',o:false},
        cpc4:{n:'CPC4',i:'🎯',o:true},
        cpc5:{n:'CPC5',i:'🎯',o:true},
        xaxia:{n:'Xa XIa',i:'🐍',o:true},
        thuongphuoc:{n:'Thuong Phuoc',i:'⚔️',o:true},
        phatlai:{n:'Ga Phat Lai',i:'📹',o:true}
    };
    var STREAMS={
        cpc2:'https://cdn.livega.tv/live/0fda3d97812098ad242c495d9fb07cc3/index.m3u8',
        cpc3:'',
        cpc4:'https://cdn.livega.tv/live/9a855e12d0ac40d55ad48b225ef3dd94/index.m3u8',
        cpc5:'https://cdn.livega.tv/live/00a2f7fc549fc71336f7e38b3f5082fe/index.m3u8',
        xaxia:'https://cdn.livega.tv/live/8eef6cecd0622651b5c666b1dfea552d/index.m3u8',
        thuongphuoc:'https://cdn.livega.tv/live/dc09d2cf9561f03e6ab63583a1724dfc/index.m3u8',
        phatlai:'https://cdn.livega.tv/live/06301fa0a4a6f2e87bc64489fcaa5519/index.m3u8'
    };
    
    var cur='cpc2';
    var vid=document.getElementById('videoPlayer');
    var wrap=document.getElementById('videoWrap');
    var overlay=document.getElementById('videoOverlay');
    var txt=document.getElementById('overlayText');
    var nav=document.getElementById('arenaNav');
    var startScreen=document.getElementById('startScreen');
    var startBtn=document.getElementById('startBtn');
    var fullscreenBtn=document.getElementById('fullscreenBtn');
    
    function renderArenas(){
        nav.innerHTML='';
        for(var k in ARENAS){
            var a=ARENAS[k];
            var b=document.createElement('button');
            b.className='arena-btn'+(k===cur?' active':'');
            b.innerHTML='<span class="ico">'+a.i+'</span><span>'+a.n+'</span>';
            b.onclick=(function(key){
                return function(){
                    cur=key;
                    renderArenas();
                    loadStream();
                };
            })(k);
            nav.appendChild(b);
        }
    }
    
    function loadStream(){
        var url=STREAMS[cur];
        if(url){
            vid.src=url;
            vid.muted=false;
            vid.volume=1;
            wrap.classList.add('has-video');
            vid.play().catch(function(){
                vid.muted=true;
                vid.play().catch(function(){});
            });
        } else {
            wrap.classList.remove('has-video');
            txt.textContent='Chua co link: '+ARENAS[cur].n;
        }
    }
    
    startBtn.onclick=function(){
        startScreen.classList.add('hide');
        loadStream();
    };
    
    vid.ontouchend=function(e){
        wrap.classList.add('show-controls');
        clearTimeout(vid.hideTimer);
        vid.hideTimer=setTimeout(function(){
            wrap.classList.remove('show-controls');
        },3000);
    };
    
    document.addEventListener('click',function(e){
        if(!wrap.contains(e.target)){
            wrap.classList.remove('show-controls');
        }
    });
    
    function toggleFullscreen(){
        var target=vid;
        if(document.fullscreenElement||document.webkitFullscreenElement){
            if(document.exitFullscreen){
                document.exitFullscreen();
            } else if(document.webkitExitFullscreen){
                document.webkitExitFullscreen();
            }
        } else {
            if(target.requestFullscreen){
                target.requestFullscreen();
            } else if(target.webkitRequestFullscreen){
                target.webkitRequestFullscreen();
            } else if(target.webkitEnterFullscreen){
                target.webkitEnterFullscreen();
            }
        }
    }
    
    fullscreenBtn.onclick=function(e){
        e.stopPropagation();
        toggleFullscreen();
    };
    
    vid.onplay=function(){
        wrap.classList.add('has-video');
    };
    
    vid.onerror=function(){
        wrap.classList.remove('has-video');
        txt.textContent='Loi phat video';
    };
    
    vid.onwaiting=function(){
        txt.textContent='Dang tai...';
    };
    
    vid.onplaying=function(){
        txt.textContent='Dang phat...';
    };
    
    vid.onstalled=function(){
        txt.textContent='Dang tai stream...';
    };
    
    renderArenas();
})();
</script>
</body>
</html>
