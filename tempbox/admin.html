<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempBox Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <style>
    :root {
      --bg: #09090b;
      --surface: #111113;
      --elevated: #1a1a1f;
      --border: rgba(255,255,255,0.07);
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --radius: 14px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .header nav { display: flex; gap: 14px; font-size: 0.85rem; }
    .header nav a { color: var(--text-3); font-weight: 500; }
    .header nav a:hover { color: var(--text); text-decoration: none; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .stat-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-3); }
    .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.blue .stat-value { color: var(--accent); }
    .stat-card.orange .stat-value { color: var(--orange); }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-body { padding: 16px 18px; }

    .provider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .provider-card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .provider-card h4 { font-size: 0.85rem; margin-bottom: 4px; color: var(--text-2); }
    .provider-card .pv-stat { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .provider-card .pv-label { font-size: 0.72rem; color: var(--text-3); }

    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .status-dot.online { background: var(--green); }
    .status-dot.offline { background: var(--red); }

    .health-check { display: flex; gap: 14px; flex-wrap: wrap; }
    .health-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
    .check-btn {
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
    }
    .check-btn:hover { border-color: var(--accent); color: var(--accent); }
    .health-result { font-size: 0.75rem; }

    .log-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .log-table th, .log-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .log-table th { color: var(--text-3); font-weight: 600; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.5px; }
    .log-table td { color: var(--text-2); }
    .log-table .status-ok { color: var(--green); }
    .log-table .status-err { color: var(--red); }

    .refresh-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .refresh-btn:hover { filter: brightness(1.1); }

    @media(max-width:600px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .provider-grid { grid-template-columns: 1fr; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>⚙️ TempBox Admin</h1>
  <nav>
    <a href="index.html">← App</a>
    <a href="docs.html">API Docs</a>
  </nav>
</div>

<div class="container">
  <div class="stats-grid">
    <div class="stat-card green">
      <div class="stat-label">Uptime</div>
      <div class="stat-value" id="uptime">--</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Requests</div>
      <div class="stat-value" id="totalRequests">0</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">Email tạo</div>
      <div class="stat-value" id="emailsCreated">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Server</div>
      <div class="stat-value" style="font-size:0.9rem;color:var(--green);">● Online</div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      Provider Status
      <div class="health-check">
        <div class="health-item">
          <span class="status-dot" id="mailtmDot"></span> Mail.tm
          <button class="check-btn" onclick="checkProvider('mailtm')">Check</button>
          <span class="health-result" id="mailtmResult"></span>
        </div>
        <div class="health-item">
          <span class="status-dot" id="guerrillaDot"></span> Guerrilla
          <button class="check-btn" onclick="checkProvider('guerrilla')">Check</button>
          <span class="health-result" id="guerrillaResult"></span>
        </div>
      </div>
    </div>
    <div class="section-body">
      <div class="provider-grid">
        <div class="provider-card">
          <h4>Mail.tm</h4>
          <div class="pv-stat" id="mailtmReqs">0</div>
          <div class="pv-label">requests</div>
        </div>
        <div class="provider-card">
          <h4>Guerrilla Mail</h4>
          <div class="pv-stat" id="guerrillaReqs">0</div>
          <div class="pv-label">requests</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      Request Logs
      <button class="refresh-btn" onclick="loadStats()">🔄 Refresh</button>
    </div>
    <div class="section-body" style="padding:0;overflow-x:auto;">
      <table class="log-table">
        <thead><tr><th>Time</th><th>Provider</th><th>Path</th><th>Status</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function formatUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm ' + (s % 60) + 's';
}

async function loadStats() {
  try {
    const res = await fetch('/admin/api/stats');
    const d = await res.json();
    document.getElementById('uptime').textContent = formatUptime(d.uptime);
    document.getElementById('totalRequests').textContent = d.totalRequests;
    document.getElementById('emailsCreated').textContent = d.emailsCreated;
    document.getElementById('mailtmReqs').textContent = d.requestsByProvider.mailtm || 0;
    document.getElementById('guerrillaReqs').textContent = d.requestsByProvider.guerrilla || 0;
    document.getElementById('logBody').innerHTML = d.recentLogs.map(l => {
      const t = new Date(l.time).toLocaleTimeString('vi-VN');
      return `<tr><td>${t}</td><td>${l.provider||'-'}</td><td>${l.path||'-'}</td><td class="${l.status<400?'status-ok':'status-err'}">${l.status}</td></tr>`;
    }).join('');
  } catch(e) { console.error(e); }
}

async function checkProvider(name) {
  const dot = document.getElementById(name + 'Dot');
  const result = document.getElementById(name + 'Result');
  result.textContent = '...';
  result.style.color = 'var(--text-2)';
  try {
    const url = name === 'mailtm' ? '/api/mailtm/domains?page=1' : '/api/guerrilla?f=get_email_address';
    const start = Date.now();
    const res = await fetch(url);
    const ms = Date.now() - start;
    dot.className = 'status-dot ' + (res.ok ? 'online' : 'offline');
    result.textContent = res.ok ? ms + 'ms ✓' : 'HTTP ' + res.status;
    result.style.color = res.ok ? 'var(--green)' : 'var(--red)';
  } catch(e) {
    dot.className = 'status-dot offline';
    result.textContent = 'Offline';
    result.style.color = 'var(--red)';
  }
}

loadStats();
setInterval(loadStats, 5000);
checkProvider('mailtm');
checkProvider('guerrilla');
</script>
</body>
</html>
